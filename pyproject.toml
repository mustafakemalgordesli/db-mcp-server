[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp-server"
version = "0.1.0"
description = "A universal Database MCP (Model Context Protocol) Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mustafa Kemal Gordesli", email = "mustafa@example.com" },
]
dependencies = [
    "mcp>=1.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "pyodbc>=5.1.0",
]

[project.scripts]
db-mcp-server = "db_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/db_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
